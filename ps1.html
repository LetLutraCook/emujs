<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS1 Web Emulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.2/nipplejs.min.js"></script>
    <style>
        body {
            background-color: #0f1117;
            color: #e5e7eb;
            font-family: system-ui, -apple-system, sans-serif;
        }
        /* Ensure responsive height scaling for mobile / small viewports */
        #emulator {
            width: 100%;
            height: 60vh;
            min-height: 360px;
            max-height: 600px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6">

    <header class="w-full max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between pb-4 border-b border-gray-800 gap-3">
        <h1 class="text-xl font-bold tracking-wide text-white flex items-center gap-2">emujs | psx</h1>
        <div class="w-full sm:w-auto flex items-center gap-3">
            <button onclick="document.getElementById('romInput').click()" class="w-full sm:w-auto px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition text-center">
                Load .bin/.cue/.iso/.chd
            </button>
            <input type="file" id="romInput" accept=".bin,.cue,.img,.chd,.iso,.zip" class="hidden" onchange="loadRom(event)">
        </div>
    </header>

    <main class="w-full max-w-4xl mx-auto flex-1 flex flex-col items-center justify-center my-4">
        <div id="dropZone" onclick="document.getElementById('romInput').click()" class="w-full h-72 sm:h-[480px] border-2 border-dashed border-gray-700 hover:border-indigo-500 rounded-xl flex flex-col items-center justify-center cursor-pointer bg-gray-900/50 transition p-6 text-center">
            <h3 class="text-lg font-semibold text-white mb-1">Drag ROM here</h3>
            <p class="text-sm text-gray-400 max-w-md">.cue / .bin / .chd / .iso / .zip</p>
        </div>

        <div id="emulatorWrapper" class="hidden w-full flex flex-col items-center">
            <div class="w-full flex flex-col sm:flex-row justify-between items-start sm:items-center mb-2 px-1 gap-2">
                <span id="gameTitle" class="text-xs sm:text-sm font-medium text-gray-300 truncate max-w-[280px] sm:max-w-md">Playing Game</span>
                <button onclick="quitGame()" class="px-3 py-1 bg-red-600/20 hover:bg-red-600/40 text-red-400 text-xs font-medium rounded border border-red-500/30 transition">
                    Close
                </button>
            </div>
            <div id="emulator" class="bg-black rounded-xl overflow-hidden shadow-2xl border border-gray-800"></div>
        </div>
    </main>

    <script>
        if (typeof window.GamepadHandler === 'undefined') {
            window.GamepadHandler = { init: function() {}, update: function() {} };
        }

        let activeObjectUrl = null;

        function loadRom(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (activeObjectUrl) URL.revokeObjectURL(activeObjectUrl);
            activeObjectUrl = URL.createObjectURL(file);

            startEmulator(file.name, activeObjectUrl);
        }

        function startEmulator(name, url) {
            document.getElementById('dropZone').classList.add('hidden');
            document.getElementById('emulatorWrapper').classList.remove('hidden');
            document.getElementById('gameTitle').innerText = 'Playing: ' + name;

            const emulatorContainer = document.getElementById('emulator');
            emulatorContainer.innerHTML = '';

            window.EJS_player = '#emulator';
            window.EJS_gameUrl = url;
            window.EJS_core = 'psx';
            window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
            window.EJS_startOnLoaded = true;
            window.EJS_mouse = true;
            window.EJS_multitap = false;

            const existingScript = document.getElementById('ejsLoader');
            if (existingScript) existingScript.remove();

            const script = document.createElement('script');
            script.id = 'ejsLoader';
            script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
            script.async = true;
            document.body.appendChild(script);
        }

        function quitGame() {
            document.getElementById('emulatorWrapper').classList.add('hidden');
            document.getElementById('dropZone').classList.remove('hidden');
            document.getElementById('emulator').innerHTML = '';
            
            if (activeObjectUrl) {
                URL.revokeObjectURL(activeObjectUrl);
                activeObjectUrl = null;
            }
            document.getElementById('romInput').value = '';
        }
    </script>
</body>
</html>
